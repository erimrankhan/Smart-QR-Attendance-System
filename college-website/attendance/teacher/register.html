<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Registration | Smart QR Attendance System</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Global & Dashboard CSS -->
    <link rel="stylesheet" href="../shared/styles.css">
    <link rel="stylesheet" href="dashboard.css">

    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 30px 20px;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95) 0%, rgba(13, 148, 136, 0.85) 100%), 
                        url('https://images.unsplash.com/photo-1524178232363-1fb2b075b655?q=80&w=1600&auto=format&fit=crop') center/cover no-repeat;
            font-family: var(--font-family);
        }

        .register-container {
            width: 100%;
            max-width: 620px;
            background: var(--glass-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.4s ease;
        }

        .register-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .register-header .logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--accent-teal), #0284c7);
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            margin-bottom: 14px;
            box-shadow: 0 8px 24px rgba(13, 148, 136, 0.4);
        }

        .register-header h2 {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .register-header p {
            font-size: 13.5px;
            color: var(--text-secondary);
        }

        .form-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 600px) {
            .register-container {
                padding: 24px 18px;
            }

            .form-grid-2 {
                grid-template-columns: 1fr;
            }
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12.5px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-primary);
            border-radius: var(--radius-md);
            font-size: 13.5px;
            font-family: inherit;
            transition: all 0.25s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-teal);
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.25);
        }

        .btn-register {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-teal), #0284c7);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            box-shadow: 0 6px 20px rgba(13, 148, 136, 0.35);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(13, 148, 136, 0.5);
        }

        /* Inline Action Wrapper for Send OTP */
        .input-action-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .input-action-wrapper .form-control {
            padding-right: 115px;
        }

        .btn-otp-action {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            padding: 7px 14px;
            background: linear-gradient(135deg, var(--accent-teal), #0284c7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: var(--radius-sm);
            color: #ffffff;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-otp-action:hover:not(:disabled) {
            background: linear-gradient(135deg, #0f766e, #0369a1);
            box-shadow: 0 4px 12px rgba(13, 148, 136, 0.4);
        }

        .btn-otp-action:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background: #334155;
            border-color: transparent;
        }

        /* Expandable OTP Verification Box */
        .otp-verification-box {
            display: none;
            flex-direction: column;
            gap: 8px;
            padding: 12px 14px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px dashed rgba(13, 148, 136, 0.5);
            border-radius: var(--radius-md);
            margin-top: 6px;
            animation: fadeInDown 0.3s ease;
        }

        .otp-verification-box.active {
            display: flex;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .otp-input-group {
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .otp-input-custom {
            flex: 1;
            padding: 9px 12px 9px 34px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 14.5px;
            font-weight: 700;
            letter-spacing: 3px;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .otp-input-custom:focus {
            outline: none;
            border-color: var(--accent-teal);
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.25);
        }

        .btn-verify-action {
            padding: 9px 15px;
            background: linear-gradient(135deg, var(--accent-teal), #0284c7);
            border: none;
            border-radius: var(--radius-sm);
            color: #ffffff;
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-verify-action:hover:not(:disabled) {
            background: linear-gradient(135deg, #0f766e, #0369a1);
            box-shadow: 0 4px 14px rgba(13, 148, 136, 0.4);
            transform: translateY(-1px);
        }

        .btn-verify-action:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .otp-status-msg {
            font-size: 11.5px;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .verified-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #10b981;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="register-container">
        <!-- Header -->
        <div class="register-header">
            <div class="logo">
                <i class="fa-solid fa-chalkboard-user"></i>
            </div>
            <h2>Faculty Portal Registration</h2>
            <p>Create your faculty account to manage QR attendance, classes & study materials</p>
        </div>

        <!-- Registration Form -->
        <form id="faculty-register-form" style="display: flex; flex-direction: column; gap: 16px;">
            <div class="form-grid-2">
                <!-- Full Name -->
                <div class="form-group">
                    <label for="name"><i class="fa-solid fa-user" style="color: var(--accent-teal);"></i> Full Name *</label>
                    <input type="text" id="name" class="form-control" placeholder="Your Name" required>
                </div>

                <!-- Employee ID -->
                <div class="form-group">
                    <label for="employee_id"><i class="fa-solid fa-id-badge" style="color: var(--accent-cyan);"></i> Employee ID (Optional)</label>
                    <input type="text" id="employee_id" class="form-control" placeholder="e.g. EMP-202601">
                </div>
            </div>

            <!-- Institutional Email with Inline OTP Verification -->
            <div class="form-group">
                <div style="display: flex; align-items: center; justify-content: space-between;">
                    <label for="email"><i class="fa-solid fa-envelope" style="color: var(--accent-teal);"></i> Email *</label>
                    <span id="facultyEmailVerifiedBadge" class="verified-badge" style="display: none;">
                        <i class="fa-solid fa-circle-check"></i> Email Verified
                    </span>
                </div>
                <div class="input-action-wrapper">
                    <input type="email" id="email" class="form-control" placeholder="faculty.member@college.edu" required>
                    <button type="button" id="sendFacultyOtpBtn" class="btn-otp-action">
                        <i class="fa-solid fa-paper-plane"></i> <span>Send OTP</span>
                    </button>
                </div>

                <!-- Expandable Faculty OTP Box -->
                <div id="facultyOtpBox" class="otp-verification-box">
                    <div class="otp-input-group">
                        <i class="fa-solid fa-key" style="color: var(--accent-teal); font-size: 13px; position: absolute; left: 12px;"></i>
                        <input type="text" id="facultyOtpInput" class="otp-input-custom" maxlength="6" placeholder="6-digit OTP" autocomplete="one-time-code">
                        <button type="button" id="verifyFacultyOtpBtn" class="btn-verify-action">
                            <i class="fa-solid fa-check"></i> <span>Verify OTP</span>
                        </button>
                    </div>
                    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 2px;">
                        <small id="facultyOtpStatus" class="otp-status-msg">Enter the 6-digit code sent to your official email.</small>
                        <button type="button" id="changeFacultyEmailBtn" style="background: none; border: none; color: var(--accent-teal); font-size: 11.5px; cursor: pointer; text-decoration: underline; display: none;">Change Email</button>
                    </div>
                </div>
            </div>

            <div class="form-grid-2">
                <!-- Phone -->
                <div class="form-group">
                    <label for="phone"><i class="fa-solid fa-phone" style="color: var(--accent-amber);"></i> Contact Phone</label>
                    <input type="tel" id="phone" class="form-control" placeholder="+91 9876543210">
                </div>

                <!-- Academic Department Dropdown -->
                <div class="form-group">
                    <label for="departmentSelect"><i class="fa-solid fa-building-columns" style="color: var(--accent-teal);"></i> Academic Department *</label>
                    <select id="departmentSelect" class="form-control" required>
                        <option value="">Loading departments...</option>
                    </select>
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password"><i class="fa-solid fa-lock" style="color: var(--accent-rose);"></i> Account Password *</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required minlength="6">
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-register" id="register-btn">
                <i class="fa-solid fa-user-plus"></i> Submit Faculty Registration
            </button>
        </form>

        <!-- Footer -->
        <div style="text-align: center; margin-top: 24px; font-size: 13.5px; color: var(--text-secondary); border-top: 1px dashed var(--glass-border); padding-top: 16px;">
            Already have an active account? <a href="login.html" style="color: var(--accent-teal); font-weight: 700; text-decoration: none;">Login Here</a>
        </div>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toast-container"></div>

    <!-- Utilities & Registration Logic Scripts -->
    <script src="../shared/utils.js"></script>
    <script src="register.js"></script>
</body>
</html>
