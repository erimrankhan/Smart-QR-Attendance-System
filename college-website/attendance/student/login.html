<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal Login | Smart QR Attendance System</title>
    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Global & Dashboard CSS -->
    <link rel="stylesheet" href="../shared/styles.css">
    <link rel="stylesheet" href="dashboard.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100%;
            padding: 24px 16px;
            background: radial-gradient(circle at 15% 15%, #064e3b 0%, #0f172a 50%, #020617 100%);
            position: relative;
            overflow-x: hidden;
        }

        /* Animated Glowing Ambient Blobs */
        .ambient-blob {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.3) 0%, rgba(6, 182, 212, 0) 70%);
            border-radius: 50%;
            filter: blur(40px);
            z-index: 0;
            pointer-events: none;
            animation: floatBlob 8s infinite alternate ease-in-out;
        }
        .ambient-blob-2 {
            bottom: -50px;
            right: -50px;
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.25) 0%, rgba(99, 102, 241, 0) 70%);
            animation-delay: -4s;
        }

        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 30px) scale(1.1); }
        }

        .login-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: var(--radius-lg);
            padding: 40px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 30px rgba(16, 185, 129, 0.15);
            margin: auto;
            animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .login-header .logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--accent-emerald) 0%, #059669 100%);
            border-radius: var(--radius-md);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 30px;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.45);
        }
        .login-header h2 {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }
        .login-header p {
            font-size: 13.5px;
            color: var(--text-secondary);
            margin-top: 6px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 12.5px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-wrapper .form-control {
            width: 100%;
            padding: 13px 44px 13px 16px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 14px;
            transition: all var(--transition-fast);
        }
        .input-wrapper .form-control:focus {
            outline: none;
            border-color: var(--accent-emerald);
            box-shadow: 0 0 0 3.5px rgba(16, 185, 129, 0.2);
        }
        .toggle-password-btn {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            transition: color var(--transition-fast);
        }
        .toggle-password-btn:hover {
            color: var(--accent-emerald);
        }
        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px;
                border-radius: 16px;
            }
            .login-header .logo {
                width: 54px;
                height: 54px;
                font-size: 26px;
            }
            .login-header h2 {
                font-size: 21px;
            }
        }
    </style>
</head>
<body>
    <div class="ambient-blob"></div>
    <div class="ambient-blob ambient-blob-2"></div>

    <div class="login-card">
        <div class="login-header" style="margin-top: 10px;">
            <div class="logo">
                <i class="fa-solid fa-user-graduate"></i>
            </div>
            <h2>Student Portal</h2>
            <p>Smart QR Attendance System</p>
        </div>

        <form id="student-login-form">
            <div class="form-group" style="margin-bottom: 18px;">
                <label for="enrollment_no">Enrollment No. or Email</label>
                <div class="input-wrapper">
                    <input type="text" id="enrollment_no" class="form-control" placeholder="ENR-2024-001 or student@college.edu" required>
                </div>
            </div>
            <div class="form-group" style="margin-bottom: 24px;">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                    <button type="button" class="toggle-password-btn" onclick="toggleStudentPasswordVisibility()" title="Toggle Password Visibility">
                        <i class="fa-solid fa-eye" id="togglePasswordIcon"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 14px; font-size: 14px; font-weight: 800; background: var(--accent-gradient);">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In to Student Portal
            </button>
        </form>

        <p style="text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-secondary); border-top: 1px dashed var(--glass-border); padding-top: 18px;">
            Don't have an approved account? 
            <a href="register.html" style="color: var(--accent-emerald); font-weight: 800; text-decoration: none;">Register Here</a>
        </p>
    </div>

    <!-- Toast & Global Utilities -->
    <div id="toast-container"></div>
    <script src="../shared/utils.js"></script>
    <script>
        window.BACKEND_API_URL = window.API_BASE_URL || 
            (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
                ? `http://${window.location.hostname}:5000` 
                : "https://smart-qr-attendance-system-8qzs.onrender.com");

        const AUTH_API = `${window.BACKEND_API_URL}/api/auth`;

        function toggleStudentPasswordVisibility() {
            const passInput = document.getElementById('password');
            const toggleIcon = document.getElementById('togglePasswordIcon');
            if (!passInput || !toggleIcon) return;

            if (passInput.type === 'password') {
                passInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('justLoggedOut') === 'true') {
                sessionStorage.removeItem('justLoggedOut');
                if (typeof showToast === 'function') showToast('Logged out successfully.');
            }
        });

        document.getElementById('student-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            e.stopPropagation();

            const enrollment_no = document.getElementById('enrollment_no').value.trim();
            const password = document.getElementById('password').value;

            if (typeof showLoading === 'function') {
                showLoading('Authenticating Student credentials...');
            }

            try {
                const response = await fetch(`${AUTH_API}/student/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enrollment_no, password })
                });

                const data = await response.json();
                if (typeof hideLoading === 'function') hideLoading();

                if (response.ok && data.status === 'success') {
                    localStorage.setItem('studentToken', data.token);
                    localStorage.setItem('studentUser', JSON.stringify(data.user));
                    sessionStorage.setItem('justLoggedIn', 'true');

                    if (typeof showToast === 'function') {
                        showToast('Authentication successful! Redirecting to Student Dashboard...');
                    }

                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 600);
                } else {
                    if (typeof showToast === 'function') {
                        showToast(data.message || 'Invalid credentials or account pending approval.', 'error');
                    } else {
                        alert(data.message || 'Invalid credentials or account pending approval.');
                    }
                }
            } catch (err) {
                console.error('Student login error:', err);
                if (typeof hideLoading === 'function') hideLoading();
                if (typeof showToast === 'function') {
                    showToast('Unable to connect to backend server. Please verify your connection.', 'error');
                } else {
                    alert('Unable to connect to backend server.');
                }
            }
        });
    </script>
</body>
</html>
