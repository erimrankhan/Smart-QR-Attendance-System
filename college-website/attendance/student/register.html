<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | Smart QR Attendance System</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Shared & Dashboard CSS -->
    <link rel="stylesheet" href="../shared/styles.css">
    <link rel="stylesheet" href="dashboard.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
            background: #090d16;
            position: relative;
            overflow-x: hidden;
            color: #f8fafc;
        }

        /* Ambient Glowing Background Orbs */
        .ambient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            z-index: 0;
            pointer-events: none;
            opacity: 0.55;
            animation: orbFloat 10s ease-in-out infinite alternate;
        }

        .orb-1 {
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, #6366f1 0%, rgba(99, 102, 241, 0) 70%);
            top: -100px;
            left: -80px;
        }

        .orb-2 {
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, #06b6d4 0%, rgba(6, 182, 212, 0) 70%);
            bottom: -120px;
            right: -90px;
            animation-delay: -5s;
        }

        @keyframes orbFloat {
            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(30px, 40px) scale(1.1);
            }
        }

        /* Glassmorphism Register Card */
        .register-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 520px;
            background: rgba(15, 23, 42, 0.72);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 24px;
            padding: 40px 36px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            animation: cardAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Card Header */
        .register-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-icon-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #6366f1 0%, #06b6d4 100%);
            border-radius: 18px;
            color: white;
            font-size: 28px;
            margin-bottom: 16px;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.45);
        }

        .register-header h2 {
            font-size: 25px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .register-header p {
            font-size: 13.5px;
            color: #94a3b8;
            margin-top: 6px;
        }

        /* Workflow Status Pill Badge */
        .approval-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #818cf8;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 22px;
        }

        /* Form Grid Layout */
        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 12.5px;
            font-weight: 700;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Input Icon Wrappers */
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i.input-icon {
            position: absolute;
            left: 14px;
            color: #64748b;
            font-size: 15px;
            transition: color 0.2s ease;
            pointer-events: none;
        }

        .form-control-custom {
            width: 100%;
            padding: 13px 16px 13px 42px;
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 12px;
            color: #f8fafc;
            font-size: 13.5px;
            font-weight: 500;
            font-family: inherit;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .form-control-custom option {
            background: #0f172a;
            color: #f8fafc;
        }

        .form-control-custom::placeholder {
            color: #64748b;
        }

        .form-control-custom:focus {
            outline: none;
            background: rgba(15, 23, 42, 0.85);
            border-color: #6366f1;
            box-shadow: 0 0 18px rgba(99, 102, 241, 0.35);
        }

        .input-wrapper:focus-within i.input-icon {
            color: #818cf8;
        }

        /* Inline Action Wrapper for Send OTP */
        .input-action-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .input-action-wrapper .form-control-custom {
            padding-right: 110px;
        }

        .btn-otp-action {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            padding: 7px 14px;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #ffffff;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-otp-action:hover:not(:disabled) {
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        .btn-otp-action:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background: #334155;
            border-color: transparent;
        }

        /* Expandable OTP Verification Box */
        .otp-verification-box {
            display: none;
            flex-direction: column;
            gap: 8px;
            padding: 14px 16px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px dashed rgba(99, 102, 241, 0.4);
            border-radius: 14px;
            margin-top: 6px;
            animation: fadeInDown 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .otp-verification-box.active {
            display: flex;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .otp-input-group {
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .otp-input-custom {
            flex: 1;
            padding: 10px 14px 10px 38px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 10px;
            color: #f8fafc;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 3px;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .otp-input-custom:focus {
            outline: none;
            border-color: #06b6d4;
            box-shadow: 0 0 14px rgba(6, 182, 212, 0.35);
        }

        .btn-verify-action {
            padding: 10px 16px;
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-verify-action:hover:not(:disabled) {
            background: linear-gradient(135deg, #0891b2 0%, #0e7490 100%);
            box-shadow: 0 4px 14px rgba(6, 182, 212, 0.4);
            transform: translateY(-1px);
        }

        .btn-verify-action:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .otp-status-msg {
            font-size: 11.5px;
            font-weight: 600;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .verified-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #10b981;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
        }

        /* Password Show Toggle */
        .toggle-password {
            position: absolute;
            right: 14px;
            color: #64748b;
            cursor: pointer;
            font-size: 14px;
            padding: 4px;
            transition: color 0.2s ease;
        }

        .toggle-password:hover {
            color: #f8fafc;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1 0%, #3b82f6 100%);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 14.5px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(99, 102, 241, 0.55);
            background: linear-gradient(135deg, #4f46e5 0%, #2563eb 100%);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* Footer Link */
        .register-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: #94a3b8;
        }

        .register-footer a {
            color: #818cf8;
            font-weight: 700;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .register-footer a:hover {
            color: #a5b4fc;
            text-decoration: underline;
        }

        @media (max-width: 520px) {
            .register-card {
                padding: 30px 22px;
                border-radius: 18px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .register-header h2 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <!-- Ambient Glowing Background Orbs -->
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>

    <div class="register-card">
        <div class="register-header">
            <div class="brand-icon-wrapper">
                <i class="fa-solid fa-user-graduate"></i>
            </div>
            <h2>Student Registration</h2>
            <p>Smart QR Attendance System Enrollment</p>
        </div>

        <div style="text-align: center;">
            <div class="approval-badge">
                <i class="fa-solid fa-shield-halved"></i> Requires Admin Approval
            </div>
        </div>

        <form id="student-register-form" class="form-grid">
            <!-- Row 1: Enrollment No & Roll No -->
            <div class="form-row">
                <div class="form-group">
                    <label for="enrollment_no">Enrollment No. *</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-id-card input-icon"></i>
                        <input type="text" id="enrollment_no" class="form-control-custom" placeholder="25170XX"
                            required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="roll_no">Roll Number</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-hashtag input-icon"></i>
                        <input type="text" id="roll_no" class="form-control-custom" placeholder="250082014XXXX">
                    </div>
                </div>
            </div>

            <!-- Full Name -->
            <div class="form-group">
                <label for="name">Full Name *</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input type="text" id="name" class="form-control-custom" placeholder="Full Name" required>
                </div>
            </div>

            <!-- Student Email with Inline OTP Action -->
            <div class="form-group">
                <div style="display: flex; align-items: center; justify-content: space-between;">
                    <label for="email">Student Email *</label>
                    <span id="emailVerifiedBadge" class="verified-badge" style="display: none;">
                        <i class="fa-solid fa-circle-check"></i> Email Verified
                    </span>
                </div>
                <div class="input-action-wrapper">
                    <i class="fa-solid fa-envelope input-icon"></i>
                    <input type="email" id="email" class="form-control-custom" placeholder="student@college.edu" required>
                    <button type="button" id="sendOtpBtn" class="btn-otp-action">
                        <i class="fa-solid fa-paper-plane"></i> <span>Send OTP</span>
                    </button>
                </div>

                <!-- Expandable OTP Verification Box -->
                <div id="otpVerificationBox" class="otp-verification-box">
                    <div class="otp-input-group">
                        <i class="fa-solid fa-key input-icon" style="left: 12px;"></i>
                        <input type="text" id="otpInput" class="otp-input-custom" maxlength="6" placeholder="6-digit OTP" autocomplete="one-time-code">
                        <button type="button" id="verifyOtpBtn" class="btn-verify-action">
                            <i class="fa-solid fa-check"></i> <span>Verify OTP</span>
                        </button>
                    </div>
                    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 2px;">
                        <small id="otpStatusMsg" class="otp-status-msg">Enter the 6-digit code sent to your email.</small>
                        <button type="button" id="changeEmailBtn" style="background: none; border: none; color: #818cf8; font-size: 11px; cursor: pointer; text-decoration: underline; display: none;">Change Email</button>
                    </div>
                </div>
            </div>

            <!-- Course Select Dropdown -->
            <div class="form-group">
                <label for="courseSelect">Degree / Course Program *</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-book-bookmark input-icon"></i>
                    <select id="courseSelect" name="course_id" class="form-control-custom" required>
                        <option value="">Loading courses...</option>
                    </select>
                </div>
            </div>

            <!-- Row: Semester & Section Selection (2-Column Grid) -->
            <div class="form-row">
                <div class="form-group">
                    <label for="semesterSelect">Current Semester *</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-calendar-days input-icon"></i>
                        <select id="semesterSelect" name="semester_id" class="form-control-custom" disabled required>
                            <option value="">-- Select Degree / Course First --</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="sectionSelect">Enrolled Section</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-graduation-cap input-icon"></i>
                        <select id="sectionSelect" name="section_id" class="form-control-custom">
                            <option value="">Select Section (Optional)</option>
                            <option value="A">Section A</option>
                            <option value="B">Section B</option>
                            <option value="C">Section C</option>
                            <option value="D">Section D</option>
                            <option value="E">Section E</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Row 2: Password & Phone -->
            <div class="form-row">
                <div class="form-group">
                    <label for="password">Password *</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="password" class="form-control-custom" placeholder="••••••••"
                            required>
                        <i class="fa-solid fa-eye toggle-password" id="togglePassword"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-phone input-icon"></i>
                        <input type="tel" id="phone" class="form-control-custom" placeholder="+91 9876543210">
                    </div>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit" id="submit-btn">
                <i class="fa-solid fa-paper-plane"></i>
                <span>Submit Student Registration</span>
            </button>
        </form>

        <div class="register-footer">
            Already registered?
            <a href="login.html">Sign in to Student Portal</a>
        </div>
    </div>

    <!-- Toast Notification Container & Script -->
    <div id="toast-container"></div>
    <script src="../shared/utils.js"></script>

    <script>
        // Localhost Backend Configuration
        window.BACKEND_API_URL = window.API_BASE_URL || 
            (window.location.hostname && window.location.hostname !== '' 
                ? `http://${window.location.hostname}:5000` 
                : "http://localhost:5000");

        const SERVER_URL = window.BACKEND_API_URL;
        const API_BASE_URL = `${SERVER_URL}/api`;

        // Password Show/Hide Toggle
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        if (togglePassword && passwordInput) {
            togglePassword.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                togglePassword.className = type === 'password' ? 'fa-solid fa-eye toggle-password' : 'fa-solid fa-eye-slash toggle-password';
            });
        }

        let loadedCoursesCache = [];

        function getOrdinal(n) {
            const s = ["th", "st", "nd", "rd"];
            const v = n % 100;
            return n + (s[(v - 20) % 10] || s[v] || s[0]);
        }

        function determineMaxSemesters(course) {
            if (!course) return 8;

            if (course.total_semesters && !isNaN(parseInt(course.total_semesters, 10))) {
                return parseInt(course.total_semesters, 10);
            }

            if (course.duration_years && !isNaN(parseInt(course.duration_years, 10))) {
                const years = parseInt(course.duration_years, 10);
                if (years >= 1 && years <= 6) {
                    return years * 2;
                }
            }

            const text = `${course.name || ''} ${course.code || ''}`.toUpperCase();

            if (/\b(MCA|MBA|M\.?SC|M\.?TECH|M\.?COM|M\.?A|M\.?PLAN|POST\s*GRADUATE|MASTER)\b/i.test(text)) {
                return 4;
            }

            if (/\b(BCA|BBA|B\.?SC|B\.?COM|B\.?A|DIPLOMA|POLYTECHNIC)\b/i.test(text)) {
                return 6;
            }

            if (/\b(B\.?TECH|B\.?E|ENGINEERING|TECHNOLOGY|B\.?PHARM)\b/i.test(text)) {
                return 8;
            }

            return 8;
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadCourses();
        });

        async function loadCourses() {
            const courseDropdown = document.getElementById('courseSelect');
            if (!courseDropdown) return;

            try {
                courseDropdown.innerHTML = '<option value="">Loading courses...</option>';

                const response = await fetch(`${SERVER_URL}/api/public/courses`);
                const result = await response.json();

                const courseList = result.data || result.courses || [];
                loadedCoursesCache = courseList;

                if (courseList.length > 0) {
                    courseDropdown.innerHTML = '<option value="">Select Degree / Course Program *</option>' +
                        courseList.map(course => `<option value="${course.id}">${course.name} (${course.code})</option>`).join('');
                } else {
                    courseDropdown.innerHTML = '<option value="">No courses available</option>';
                }
            } catch (error) {
                console.error('Error loading courses:', error);
                courseDropdown.innerHTML = '<option value="">Error connecting to server</option>';
            }
        }

        function handleCourseChange(courseId) {
            const semesterSelect = document.getElementById('semesterSelect');
            if (!semesterSelect) return;

            if (!courseId) {
                semesterSelect.innerHTML = '<option value="">-- Select Degree / Course First --</option>';
                semesterSelect.disabled = true;
                semesterSelect.value = '';
                loadSectionsForCourse(null);
                return;
            }

            const selectedCourse = loadedCoursesCache.find(c => String(c.id) === String(courseId));
            const maxSemesters = determineMaxSemesters(selectedCourse);

            let optionsHtml = '<option value="">Select Current Semester *</option>';
            for (let i = 1; i <= maxSemesters; i++) {
                optionsHtml += `<option value="${i}">Semester ${i} (${getOrdinal(i)} Sem)</option>`;
            }

            semesterSelect.innerHTML = optionsHtml;
            semesterSelect.disabled = false;
            semesterSelect.value = '';

            loadSectionsForCourse(courseId);
        }

        async function loadSectionsForCourse(courseId) {
            const sectionDropdown = document.getElementById('sectionSelect');
            if (!sectionDropdown) return;

            const defaultOptions = `
                <option value="">Select Section (Optional)</option>
                <option value="A">Section A</option>
                <option value="B">Section B</option>
                <option value="C">Section C</option>
                <option value="D">Section D</option>
                <option value="E">Section E</option>
            `;

            if (!courseId) {
                sectionDropdown.innerHTML = defaultOptions;
                return;
            }

            try {
                const response = await fetch(`${SERVER_URL}/api/public/sections/${courseId}`);
                const result = await response.json();

                const sections = result.data || result.sections || [];

                if (sections.length > 0) {
                    sectionDropdown.innerHTML = '<option value="">Select Section (Optional)</option>' +
                        sections.map(s => {
                            const name = s.name || s.section_name || 'Section';
                            const semText = s.semester_number ? ` (Sem ${s.semester_number})` : '';
                            return `<option value="${s.id || name}">Section ${name}${semText}</option>`;
                        }).join('');
                } else {
                    sectionDropdown.innerHTML = defaultOptions;
                }
            } catch (err) {
                console.warn('Using standard section fallback:', err);
                sectionDropdown.innerHTML = defaultOptions;
            }
        }

        const courseSelectEl = document.getElementById('courseSelect');
        if (courseSelectEl) {
            courseSelectEl.addEventListener('change', (e) => {
                handleCourseChange(e.target.value);
            });
        }

        let isEmailVerified = false;
        let otpCooldownTimer = null;
        let otpSecondsRemaining = 0;

        const emailInput = document.getElementById('email');
        const sendOtpBtn = document.getElementById('sendOtpBtn');
        const otpVerificationBox = document.getElementById('otpVerificationBox');
        const otpInput = document.getElementById('otpInput');
        const verifyOtpBtn = document.getElementById('verifyOtpBtn');
        const otpStatusMsg = document.getElementById('otpStatusMsg');
        const changeEmailBtn = document.getElementById('changeEmailBtn');
        const emailVerifiedBadge = document.getElementById('emailVerifiedBadge');

        function startOtpCooldown(duration = 60) {
            otpSecondsRemaining = duration;
            if (sendOtpBtn) {
                sendOtpBtn.disabled = true;
                sendOtpBtn.innerHTML = `<i class="fa-solid fa-clock"></i> <span>Resend (${otpSecondsRemaining}s)</span>`;
            }

            clearInterval(otpCooldownTimer);
            otpCooldownTimer = setInterval(() => {
                otpSecondsRemaining--;
                if (otpSecondsRemaining <= 0) {
                    clearInterval(otpCooldownTimer);
                    if (sendOtpBtn && !isEmailVerified) {
                        sendOtpBtn.disabled = false;
                        sendOtpBtn.innerHTML = `<i class="fa-solid fa-rotate-right"></i> <span>Resend OTP</span>`;
                    }
                } else {
                    if (sendOtpBtn && !isEmailVerified) {
                        sendOtpBtn.innerHTML = `<i class="fa-solid fa-clock"></i> <span>Resend (${otpSecondsRemaining}s)</span>`;
                    }
                }
            }, 1000);
        }

        if (sendOtpBtn) {
            sendOtpBtn.addEventListener('click', async () => {
                const emailVal = emailInput ? emailInput.value.trim() : '';

                if (!emailVal) {
                    if (typeof showToast === 'function') showToast('Please enter your email address first.', 'warning');
                    else alert('Please enter your email address first.');
                    if (emailInput) emailInput.focus();
                    return;
                }

                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(emailVal)) {
                    if (typeof showToast === 'function') showToast('Please enter a valid email address.', 'error');
                    else alert('Please enter a valid email address.');
                    if (emailInput) emailInput.focus();
                    return;
                }

                sendOtpBtn.disabled = true;
                sendOtpBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>Sending...</span>`;

                try {
                    const response = await fetch(`${API_BASE_URL}/auth/send-otp`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: emailVal })
                    });
                    const resData = await response.json();

                    if (response.ok && resData.status === 'success') {
                        if (typeof showToast === 'function') {
                            showToast(resData.message || `OTP sent successfully to ${emailVal}`);
                        } else {
                            alert(resData.message || `OTP sent successfully to ${emailVal}`);
                        }

                        if (otpVerificationBox) {
                            otpVerificationBox.style.display = 'flex';
                            otpVerificationBox.classList.add('active');
                        }
                        if (emailInput) emailInput.readOnly = true;
                        if (changeEmailBtn) changeEmailBtn.style.display = 'inline-block';
                        if (otpInput) {
                            otpInput.value = '';
                            otpInput.focus();
                        }
                        if (otpStatusMsg) {
                            otpStatusMsg.innerHTML = `<i class="fa-solid fa-paper-plane" style="color: #38bdf8;"></i> Code sent to <strong style="color:#f8fafc;">${emailVal}</strong> (valid for 10m)`;
                        }

                        startOtpCooldown(60);
                    } else {
                        if (typeof showToast === 'function') {
                            showToast(resData.message || 'Failed to send OTP.', 'error');
                        } else {
                            alert(resData.message || 'Failed to send OTP.');
                        }
                        sendOtpBtn.disabled = false;
                        sendOtpBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> <span>Send OTP</span>`;
                    }
                } catch (err) {
                    console.error('Send OTP network error:', err);
                    if (typeof showToast === 'function') showToast('Connection error. Failed to reach server.', 'error');
                    else alert('Connection error. Failed to reach server.');
                    sendOtpBtn.disabled = false;
                    sendOtpBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> <span>Send OTP</span>`;
                }
            });
        }

        if (verifyOtpBtn) {
            verifyOtpBtn.addEventListener('click', async () => {
                const emailVal = emailInput ? emailInput.value.trim() : '';
                const otpVal = otpInput ? otpInput.value.trim() : '';

                if (!otpVal || otpVal.length < 4) {
                    if (typeof showToast === 'function') showToast('Please enter the 6-digit OTP code.', 'warning');
                    else alert('Please enter the 6-digit OTP code.');
                    if (otpInput) otpInput.focus();
                    return;
                }

                verifyOtpBtn.disabled = true;
                verifyOtpBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>Verifying...</span>`;

                try {
                    const response = await fetch(`${API_BASE_URL}/auth/verify-otp`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: emailVal, otp: otpVal })
                    });
                    const resData = await response.json();

                    if (response.ok && resData.status === 'success') {
                        isEmailVerified = true;
                        clearInterval(otpCooldownTimer);

                        if (typeof showToast === 'function') {
                            showToast('Email verified successfully!', 'success');
                        } else {
                            alert('Email verified successfully!');
                        }

                        if (emailVerifiedBadge) emailVerifiedBadge.style.display = 'inline-flex';
                        if (sendOtpBtn) sendOtpBtn.style.display = 'none';
                        if (otpVerificationBox) otpVerificationBox.style.display = 'none';
                        if (emailInput) {
                            emailInput.readOnly = true;
                            emailInput.style.borderColor = '#10b981';
                        }
                    } else {
                        if (typeof showToast === 'function') {
                            showToast(resData.message || 'Invalid or expired OTP code.', 'error');
                        } else {
                            alert(resData.message || 'Invalid or expired OTP code.');
                        }
                        verifyOtpBtn.disabled = false;
                        verifyOtpBtn.innerHTML = `<i class="fa-solid fa-check"></i> <span>Verify OTP</span>`;
                        if (otpInput) {
                            otpInput.style.borderColor = '#f43f5e';
                            otpInput.focus();
                        }
                    }
                } catch (err) {
                    console.error('Verify OTP network error:', err);
                    if (typeof showToast === 'function') showToast('Connection error during verification.', 'error');
                    else alert('Connection error during verification.');
                    verifyOtpBtn.disabled = false;
                    verifyOtpBtn.innerHTML = `<i class="fa-solid fa-check"></i> <span>Verify OTP</span>`;
                }
            });
        }

        if (changeEmailBtn) {
            changeEmailBtn.addEventListener('click', () => {
                clearInterval(otpCooldownTimer);
                isEmailVerified = false;
                if (emailInput) {
                    emailInput.readOnly = false;
                    emailInput.style.borderColor = '';
                    emailInput.focus();
                }
                if (otpVerificationBox) {
                    otpVerificationBox.style.display = 'none';
                    otpVerificationBox.classList.remove('active');
                }
                if (sendOtpBtn) {
                    sendOtpBtn.disabled = false;
                    sendOtpBtn.style.display = 'inline-flex';
                    sendOtpBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> <span>Send OTP</span>`;
                }
                if (emailVerifiedBadge) emailVerifiedBadge.style.display = 'none';
                if (otpInput) otpInput.value = '';
            });
        }

        document.getElementById('student-register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submit-btn');
            const courseVal = document.getElementById('courseSelect').value;
            const semesterVal = document.getElementById('semesterSelect').value;
            const secVal = document.getElementById('sectionSelect').value;

            if (!isEmailVerified) {
                if (typeof showToast === 'function') {
                    showToast('Please verify your email address via OTP first.', 'warning');
                } else {
                    alert('Please verify your email address via OTP first.');
                }
                if (!otpVerificationBox.classList.contains('active')) {
                    if (sendOtpBtn) sendOtpBtn.click();
                } else {
                    if (otpInput) otpInput.focus();
                }
                return;
            }

            if (!courseVal) {
                if (typeof showToast === 'function') showToast('Please select a Degree / Course Program.', 'error');
                else alert('Please select a Degree / Course Program.');
                return;
            }

            if (!semesterVal) {
                if (typeof showToast === 'function') showToast('Please select your Current Semester.', 'error');
                else alert('Please select your Current Semester.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Submitting...`;

            // Auto-fetch department_id from loaded course cache
            const selectedCourseObj = loadedCoursesCache.find(c => String(c.id) === String(courseVal));
            const deptId = selectedCourseObj ? (selectedCourseObj.department_id || null) : null;

            // Normalize section numeric id vs string code
            const parsedSecId = (!isNaN(parseInt(secVal, 10)) && String(parseInt(secVal, 10)) === String(secVal)) 
                ? parseInt(secVal, 10) 
                : null;

            const payload = {
                enrollment_no: document.getElementById('enrollment_no').value.trim(),
                roll_no: document.getElementById('roll_no').value.trim() || null,
                name: document.getElementById('name').value.trim(),
                email: document.getElementById('email').value.trim(),
                department_id: deptId,
                course_id: parseInt(courseVal, 10),
                semester_id: parseInt(semesterVal, 10) || 1,
                semester: parseInt(semesterVal, 10) || 1,
                section_id: parsedSecId,
                section: secVal || 'A',
                section_name: secVal || 'A',
                password: document.getElementById('password').value,
                phone: document.getElementById('phone').value.trim() || null
            };

            try {
                const response = await fetch(`${API_BASE_URL}/auth/student/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const resData = await response.json();

                if (response.ok && (resData.status === 'success' || resData.success === true)) {
                    if (typeof showToast === 'function') {
                        showToast('Registration successful! Your account is pending Admin approval.', 'success');
                    } else {
                        alert('Registration successful! Your account is pending Admin approval.');
                    }
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);
                } else {
                    if (typeof showToast === 'function') {
                        showToast(resData.message || 'Registration failed.', 'error');
                    } else {
                        alert(resData.message || 'Registration failed.');
                    }
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> <span>Submit Student Registration</span>`;
                }
            } catch (err) {
                if (typeof showToast === 'function') {
                    showToast('Connection error during registration. Please try again.', 'error');
                } else {
                    alert('Connection error during registration. Please try again.');
                }
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> <span>Submit Student Registration</span>`;
            }
        });
    </script>
</body>
