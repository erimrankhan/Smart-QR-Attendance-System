<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imran Institute | ERP Portal Router</title>
    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="shared/styles.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            min-height: 100vh;
        }
        .router-card {
            width: 100%;
            max-width: 520px;
            background: var(--glass-card);
            backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 40px;
            box-shadow: var(--glass-shadow);
            text-align: center;
        }
        .router-header .logo {
            width: 60px;
            height: 60px;
            background: var(--accent-gradient);
            border-radius: var(--radius-md);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            margin-bottom: 16px;
        }
        .router-header h2 { font-size: 24px; font-weight: 800; }
        .router-header p { font-size: 13.5px; color: var(--text-secondary); margin-top: 6px; margin-bottom: 32px; }

        .portal-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .portal-link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        .portal-link-btn:hover {
            background: rgba(99, 102, 241, 0.15);
            border-color: var(--accent-indigo);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="router-card">
        <div class="router-header">
            <div class="logo">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <h2>Imran Institute</h2>
            <p style="margin-top: 2px; color: var(--accent-indigo); font-weight: 700; font-size: 13px;">Smart QR Attendance ERP</p>
            <p style="margin-top: 4px; margin-bottom: 24px;">Select your portal access point to sign in</p>
        </div>

        <div class="portal-grid">
            <a href="admin/login.html" class="portal-link-btn">
                <span><i class="fa-solid fa-user-shield" style="margin-right: 10px; color: #6366f1;"></i> Administrator Portal</span>
                <i class="fa-solid fa-chevron-right" style="font-size: 12px;"></i>
            </a>
            <a href="teacher/login.html" class="portal-link-btn">
                <span><i class="fa-solid fa-chalkboard-user" style="margin-right: 10px; color: #0d9488;"></i> Faculty Portal</span>
                <i class="fa-solid fa-chevron-right" style="font-size: 12px;"></i>
            </a>
            <a href="student/login.html" class="portal-link-btn">
                <span><i class="fa-solid fa-user-graduate" style="margin-right: 10px; color: #10b981;"></i> Student Portal</span>
                <i class="fa-solid fa-chevron-right" style="font-size: 12px;"></i>
            </a>
        </div>
        <div style="margin-top: 24px; font-size: 13px;">
            <a href="../index.html" style="color: var(--text-muted); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: color 0.2s;">
                <i class="fa-solid fa-arrow-left"></i> Back to Imran Institute Website
            </a>
        </div>
    </div>
</body>
</html>
